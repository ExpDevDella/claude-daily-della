name: Build Daily Feed

on:
  schedule:
    # Roda todo dia às 12:00 UTC = 09:00 BRT
    - cron: '0 12 * * *'
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    branches: [main]
    paths:
      - 'data/sources.json'
      - 'scripts/build_feed.py'

permissions:
  contents: write           # precisa pra dar git push de volta no repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build feed
        run: python scripts/build_feed.py

      - name: Commit & push if changed
        run: |
          git config user.name  "claude-daily-bot"
          git config user.email "claude-daily-bot@users.noreply.github.com"
          git add data/feed.json data/archive/
          if git diff --cached --quiet; then
            echo "Nada mudou. Saindo."
          else
            git commit -m "feed: edição $(date -u +'%Y-%m-%d')"
            git push
          fi
